trigger: none


pool:
  name: akhileshagent


variables:

  terraformVersion: '1.15.6'



stages:


- stage: Terraform_Deployment

  displayName: Terraform Dev and Prod Deployment



  jobs:



  # ======================
  # DEV
  # ======================


  - job: DEV

    displayName: Terraform DEV Deployment


    variables:

      terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/infra/dev'



    steps:



    - task: TerraformInstaller@1

      displayName: Install Terraform

      inputs:

        terraformVersion: $(terraformVersion)




    - script: |

        terraform fmt -check -recursive

      displayName: Terraform Format Check





    - task: TerraformTask@5

      displayName: Terraform Init DEV

      inputs:

        provider: azurerm

        command: init

        workingDirectory: $(terraformWorkingDirectory)


        backendServiceArm: akhileshserviveconnection

        backendAzureRmResourceGroupName: akhileshtestpip

        backendAzureRmStorageAccountName: akhileshstoragepipi

        backendAzureRmContainerName: akhileshcanttest

        backendAzureRmKey: pipe.tfstate





    - task: TerraformTask@5

      displayName: Terraform Validate DEV

      inputs:

        provider: azurerm

        command: validate

        workingDirectory: $(terraformWorkingDirectory)





    - task: TerraformTask@5

      displayName: Terraform Plan DEV

      inputs:

        provider: azurerm

        command: plan

        workingDirectory: $(terraformWorkingDirectory)

        environmentServiceNameAzureRM: akhileshserviveconnection

        commandOptions: '-out=tfplan'





    - task: TerraformTask@5

      displayName: Terraform Apply DEV

      inputs:

        provider: azurerm

        command: apply

        workingDirectory: $(terraformWorkingDirectory)

        environmentServiceNameAzureRM: akhileshserviveconnection

        commandOptions: 'tfplan'







  # ======================
  # PROD
  # ======================


  - job: PROD

    displayName: Terraform PROD Deployment


    dependsOn: DEV



    variables:

      terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/infra/prod'



    steps:



    - task: TerraformInstaller@1

      displayName: Install Terraform

      inputs:

        terraformVersion: $(terraformVersion)





    - task: TerraformTask@5

      displayName: Terraform Init PROD

      inputs:

        provider: azurerm

        command: init

        workingDirectory: $(terraformWorkingDirectory)


        backendServiceArm: akhileshserviveconnection

        backendAzureRmResourceGroupName: akhileshtestpip

        backendAzureRmStorageAccountName: akhileshstoragepipi

        backendAzureRmContainerName: akhileshcanttest

        backendAzureRmKey: prod.tfstate






    - task: TerraformTask@5

      displayName: Terraform Validate PROD

      inputs:

        provider: azurerm

        command: validate

        workingDirectory: $(terraformWorkingDirectory)






    - task: TerraformTask@5

      displayName: Terraform Plan PROD

      inputs:

        provider: azurerm

        command: plan

        workingDirectory: $(terraformWorkingDirectory)

        environmentServiceNameAzureRM: akhileshserviveconnection

        commandOptions: '-out=tfplan'






    - task: ManualValidation@0

      displayName: PROD Approval

      inputs:

        notifyUsers: |
          admin@company.com

        instructions: |
          Review Terraform Plan and Approve Production Deployment






    - task: TerraformTask@5

      displayName: Terraform Apply PROD

      inputs:

        provider: azurerm

        command: apply

        workingDirectory: $(terraformWorkingDirectory)

        environmentServiceNameAzureRM: akhileshserviveconnection

        commandOptions: 'tfplan'