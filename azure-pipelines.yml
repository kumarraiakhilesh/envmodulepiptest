trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: akhileshrai

variables:
  terraformVersion: '1.15.9'
  workingDirectory: '$(System.DefaultWorkingDirectory)/Env/Dev'
  azureServiceConnection: 'akhileshinf'

  # Terraform remote backend
  backendResourceGroup: 'akhileshtestpip'
  backendStorageAccount: 'akhileshstoragepipi1'
  backendContainer: 'akhileshcanttest1'
  backendKey: 'pipe.tfstate'

stages:

# =====================================================
# STAGE 1: SECURITY SCAN, INIT, VALIDATE AND PLAN
# =====================================================
- stage: TerraformPlan
  displayName: Security Scan and Terraform Plan

  jobs:
  - job: TerraformPlanJob
    displayName: Terraform Security and Plan

    steps:

    - checkout: self
      clean: true
      fetchDepth: 0

    # -------------------------------------------------
    # Download Terraform directly
    # -------------------------------------------------
    - task: PowerShell@2
      displayName: Download and Install Terraform
      inputs:
        targetType: inline
        script: |
          $terraformVersion = "$(terraformVersion)"
          $downloadUrl = "https://releases.hashicorp.com/terraform/$terraformVersion/terraform_${terraformVersion}_windows_amd64.zip"
          $zipFile = "$(Agent.TempDirectory)\terraform-$terraformVersion.zip"
          $installDirectory = "$(Agent.TempDirectory)\terraform-$terraformVersion"

          Write-Host "Downloading Terraform: $downloadUrl"

          if (Test-Path $zipFile) {
            Remove-Item -Path $zipFile -Force
          }

          if (Test-Path $installDirectory) {
            Remove-Item -Path $installDirectory -Recurse -Force
          }

          New-Item -Path $installDirectory -ItemType Directory -Force | Out-Null

          Invoke-WebRequest -Uri $downloadUrl -OutFile $zipFile

          if (-not (Test-Path $zipFile)) {
            Write-Error "Terraform download failed."
            exit 1
          }

          Expand-Archive -Path $zipFile -DestinationPath $installDirectory -Force

          $terraformExe = Join-Path $installDirectory "terraform.exe"

          if (-not (Test-Path $terraformExe)) {
            Write-Error "terraform.exe was not found."
            exit 1
          }

          Write-Host "##vso[task.prependpath]$installDirectory"

          & $terraformExe version

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform verification failed."
            exit 1
          }

    # -------------------------------------------------
    # Verify Terraform path
    # -------------------------------------------------
    - task: PowerShell@2
      displayName: Verify Terraform Installation
      inputs:
        targetType: inline
        script: |
          $terraformCommand = Get-Command terraform -ErrorAction SilentlyContinue

          if (-not $terraformCommand) {
            Write-Error "Terraform is not available in PATH."
            exit 1
          }

          Write-Host "Terraform executable:"
          Write-Host $terraformCommand.Source

          terraform version

    # -------------------------------------------------
    # Terraform Format Check
    # -------------------------------------------------
    - task: PowerShell@2
      displayName: Terraform Format Check
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          terraform fmt -check -recursive

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform formatting check failed."
            Write-Host "Run locally: terraform fmt -recursive"
            exit 1
          }

          Write-Host "Terraform formatting check passed."

    # -------------------------------------------------
    # Terraform Init
    # -------------------------------------------------
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: '$(backendResourceGroup)'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: '$(backendContainer)'
        backendAzureRmKey: '$(backendKey)'

    # -------------------------------------------------
    # Terraform Validate
    # -------------------------------------------------
    - task: TerraformTask@5
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(workingDirectory)'

    # -------------------------------------------------
    # Install security scanners
    # -------------------------------------------------
    - task: PowerShell@2
      displayName: Install Security Scanning Tools
      inputs:
        targetType: inline
        script: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Error "Chocolatey is not installed."
            exit 1
          }

          if (-not (Get-Command tflint -ErrorAction SilentlyContinue)) {
            Write-Host "Installing TFLint..."
            choco install tflint -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              Write-Error "TFLint installation failed."
              exit 1
            }
          }

          if (-not (Get-Command tfsec -ErrorAction SilentlyContinue)) {
            Write-Host "Installing tfsec..."
            choco install tfsec -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              Write-Error "tfsec installation failed."
              exit 1
            }
          }

          if (-not (Get-Command gitleaks -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Gitleaks..."
            choco install gitleaks -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Gitleaks installation failed."
              exit 1
            }
          }

          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            Write-Error "Python is not installed."
            exit 1
          }

          Write-Host "Installing Checkov..."
          python -m pip install --upgrade checkov

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Checkov installation failed."
            exit 1
          }

    # -------------------------------------------------
    # TFLint Scan
    # -------------------------------------------------
    - task: PowerShell@2
      displayName: TFLint Scan
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          tflint --init

          if ($LASTEXITCODE -ne 0) {
            Write-Error "TFLint initialization failed."
            exit 1
          }

          tflint --recursive

          if ($LASTEXITCODE -ne 0) {
            Write-Error "TFLint detected Terraform issues."
            exit 1
          }

    # -------------------------------------------------
    # tfsec Scan
    # -------------------------------------------------
    - task: PowerShell@2
      displayName: tfsec Security Scan
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          tfsec . --minimum-severity HIGH

          if ($LASTEXITCODE -ne 0) {
            Write-Error "tfsec detected HIGH or CRITICAL security issues."
            exit 1
          }

    # -------------------------------------------------
    # Checkov Scan
    # -------------------------------------------------
    - task: PowerShell@2
      displayName: Checkov IaC Security Scan
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          python -m checkov.main `
            --directory . `
            --framework terraform `
            --compact `
            --soft-fail-on MEDIUM,LOW

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Checkov detected blocking security issues."
            exit 1
          }

    # -------------------------------------------------
    # Gitleaks Scan
    # -------------------------------------------------
    - task: PowerShell@2
      displayName: Gitleaks Secret Scan
      inputs:
        targetType: inline
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        script: |
          gitleaks detect `
            --source "$(System.DefaultWorkingDirectory)" `
            --no-banner `
            --redact `
            --verbose

          if ($LASTEXITCODE -ne 0) {
            Write-Error "