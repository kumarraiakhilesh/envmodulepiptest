trigger: none

pool:
  name: akhileshrai

variables:
  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/infra'

steps:

# Install Terraform
- task: TerraformInstaller@1
  displayName: Install Terraform
  inputs:
    terraformVersion: 'latest'

# Check Terraform formatting
- task: TerraformTask@5
  displayName: Terraform Format Check
  inputs:
    provider: 'azurerm'
    command: 'custom'
    customCommand: 'fmt'
    workingDirectory: '$(terraformWorkingDirectory)'
    commandOptions: '-check -recursive'

# Terraform Init
- task: TerraformTask@5
  displayName: Terraform Init
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(terraformWorkingDirectory)'
    backendServiceArm: 'Azure-Service-Connection'
    backendAzureRmResourceGroupName: 'g2'
    backendAzureRmStorageAccountName: 'gstorageakhilesh'
    backendAzureRmContainerName: 'g2cant'
    backendAzureRmKey: 'terraform.tfstate'

# Terraform Validate
- task: TerraformTask@5
  displayName: Terraform Validate
  inputs:
    provider: 'azurerm'
    command: 'validate'
    workingDirectory: '$(terraformWorkingDirectory)'

# Terraform Plan
- task: TerraformTask@5
  displayName: Terraform Plan
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(terraformWorkingDirectory)'
    environmentServiceNameAzureRM: 'Azure-Service-Connection'
    commandOptions: '-out=tfplan'

# Terraform Apply
- task: TerraformTask@5
  displayName: Terraform Apply
  inputs:
    provider: 'azurerm'
    command: 'apply'
    workingDirectory: '$(terraformWorkingDirectory)'
    environmentServiceNameAzureRM: 'Azure-Service-Connection'
    commandOptions: '-auto-approve tfplan'