trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  terraformVersion: '1.15.9'
  workingDirectory: '$(System.DefaultWorkingDirectory)/Env/Dev'
  azureServiceConnection: 'akhileshinf'

  backendResourceGroup: 'akhileshtestpip'
  backendStorageAccount: 'akhileshstoragepipi1'
  backendContainer: 'akhileshcanttest1'
  backendKey: 'pipe.tfstate'

  agentPool: 'akhileshrai'

stages:

# =====================================================
# STAGE 1: TERRAFORM LINT SCANNING
# =====================================================
- stage: TerraformLint
  displayName: Terraform Lint Scanning

  jobs:
  - job: TFLintJob
    displayName: TFLint Scan
    pool:
      name: $(agentPool)

    steps:
    - checkout: self
      clean: true

    - task: PowerShell@2
      displayName: Install TFLint
      inputs:
        targetType: inline
        script: |
          if (-not (Get-Command tflint -ErrorAction SilentlyContinue)) {
            choco install tflint -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              Write-Error "TFLint installation failed."
              exit 1
            }
          }

    - task: PowerShell@2
      displayName: Run TFLint
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          tflint --init

          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

          tflint --recursive

          if ($LASTEXITCODE -ne 0) {
            Write-Error "TFLint detected Terraform issues."
            exit 1
          }


# =====================================================
# STAGE 2: IAC SECURITY SCANNING
# =====================================================
- stage: IaCSecurity
  displayName: Checkov and tfsec Security Scanning
  dependsOn: TerraformLint
  condition: succeeded()

  jobs:
  - job: IaCSecurityJob
    displayName: IaC Security Scan
    pool:
      name: $(agentPool)

    steps:
    - checkout: self
      clean: true

    - task: PowerShell@2
      displayName: Install Checkov and tfsec
      inputs:
        targetType: inline
        script: |
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            Write-Error "Python is not installed."
            exit 1
          }

          python -m pip install --upgrade checkov

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Checkov installation failed."
            exit 1
          }

          if (-not (Get-Command tfsec -ErrorAction SilentlyContinue)) {
            choco install tfsec -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              Write-Error "tfsec installation failed."
              exit 1
            }
          }

    - task: PowerShell@2
      displayName: Checkov Scan
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          python -m checkov.main `
            --directory . `
            --framework terraform `
            --compact `
            --soft-fail-on MEDIUM,LOW

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Checkov detected blocking security issues."
            exit 1
          }

    - task: PowerShell@2
      displayName: tfsec Scan
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          tfsec . --minimum-severity HIGH --format default

          if ($LASTEXITCODE -ne 0) {
            Write-Error "tfsec detected HIGH or CRITICAL issues."
            exit 1
          }


# =====================================================
# STAGE 3: SECRET SCANNING
# =====================================================
- stage: SecretScanning
  displayName: Gitleaks Secret Scanning
  dependsOn: IaCSecurity
  condition: succeeded()

  jobs:
  - job: SecretScanJob
    displayName: Gitleaks Scan
    pool:
      name: $(agentPool)

    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: PowerShell@2
      displayName: Install Gitleaks
      inputs:
        targetType: inline
        script: |
          if (-not (Get-Command gitleaks -ErrorAction SilentlyContinue)) {
            choco install gitleaks -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Gitleaks installation failed."
              exit 1
            }
          }

    - task: PowerShell@2
      displayName: Run Gitleaks
      inputs:
        targetType: inline
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        script: |
          gitleaks detect `
            --source "$(System.DefaultWorkingDirectory)" `
            --redact `
            --no-banner `
            --verbose

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Gitleaks detected secrets."
            exit 1
          }


# =====================================================
# STAGE 4: TERRAFORM INIT
# =====================================================
- stage: TerraformInit
  displayName: Terraform Initialization
  dependsOn: SecretScanning
  condition: succeeded()

  jobs:
  - job: InitJob
    displayName: Terraform Init
    pool:
      name: $(agentPool)

    steps:
    - checkout: self
      clean: true

    - task: PowerShell@2
      displayName: Install Terraform
      inputs:
        targetType: inline
        script: |
          $version = "$(terraformVersion)"
          $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"
          $zip = "$(Agent.TempDirectory)\terraform-$version.zip"
          $directory = "$(Agent.TempDirectory)\terraform-$version"

          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $directory -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $directory -ItemType Directory -Force | Out-Null

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $directory -Force

          if (-not (Test-Path "$directory\terraform.exe")) {
            Write-Error "Terraform installation failed."
            exit 1
          }

          Write-Host "##vso[task.prependpath]$directory"
          & "$directory\terraform.exe" version

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: '$(backendResourceGroup)'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: '$(backendContainer)'
        backendAzureRmKey: '$(backendKey)'


# =====================================================
# STAGE 5: TERRAFORM VALIDATE
# =====================================================
- stage: TerraformValidate
  displayName: Terraform Validation
  dependsOn: TerraformInit
  condition: succeeded()

  jobs:
  - job: ValidateJob
    displayName: Terraform Validate
    pool:
      name: $(agentPool)

    steps:
    - checkout: self
      clean: true

    - task: PowerShell@2
      displayName: Install Terraform
      inputs:
        targetType: inline
        script: |
          $version = "$(terraformVersion)"
          $directory = "$(Agent.TempDirectory)\terraform-$version"
          $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"
          $zip = "$(Agent.TempDirectory)\terraform-$version.zip"

          if (-not (Test-Path "$directory\terraform.exe")) {
            New-Item $directory -ItemType Directory -Force | Out-Null
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $directory -Force
          }

          Write-Host "##vso[task.prependpath]$directory"
          & "$directory\terraform.exe" version

    # Every new stage requires Init again
    - task: TerraformTask@5
      displayName: Terraform Init for Validation
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: '$(backendResourceGroup)'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: '$(backendContainer)'
        backendAzureRmKey: '$(backendKey)'

    - task: TerraformTask@5
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(workingDirectory)'


# =====================================================
# STAGE 6: INFRASTRUCTURE UNIT TESTING
# =====================================================
- stage: InfrastructureTesting
  displayName: Terraform Unit Testing
  dependsOn: TerraformValidate
  condition: succeeded()

  jobs:
  - job: TerraformTestJob
    displayName: Terraform Test
    pool:
      name: $(agentPool)

    steps:
    - checkout: self
      clean: true

    - task: PowerShell@2
      displayName: Install Terraform and Run Tests
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          $version = "$(terraformVersion)"
          $directory = "$(Agent.TempDirectory)\terraform-$version"
          $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"
          $zip = "$(Agent.TempDirectory)\terraform-$version.zip"

          if (-not (Test-Path "$directory\terraform.exe")) {
            New-Item $directory -ItemType Directory -Force | Out-Null
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $directory -Force
          }

          $testFiles = Get-ChildItem `
            -Path . `
            -Filter "*.tftest.hcl" `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $testFiles) {
            Write-Host "No .tftest.hcl files found. Terraform Test skipped."
            exit 0
          }

          & "$directory\terraform.exe" init -backend=false

          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

          & "$directory\terraform.exe" test

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform tests failed."
            exit 1
          }


# =====================================================
# STAGE 7: TERRAFORM PLAN
# =====================================================
- stage: TerraformPlan
  displayName: Terraform Plan Generation
  dependsOn: InfrastructureTesting
  condition: succeeded()

  jobs:
  - job: PlanJob
    displayName: Generate Terraform Plan
    pool:
      name: $(agentPool)

    steps:
    - checkout: self
      clean: true

    - task: PowerShell@2
      displayName: Install Terraform
      inputs:
        targetType: inline
        script: |
          $version = "$(terraformVersion)"
          $directory = "$(Agent.TempDirectory)\terraform-$version"
          $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"
          $zip = "$(Agent.TempDirectory)\terraform-$version.zip"

          if (-not (Test-Path "$directory\terraform.exe")) {
            New-Item $directory -ItemType Directory -Force | Out-Null
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $directory -Force
          }

          Write-Host "##vso[task.prependpath]$directory"
          & "$directory\terraform.exe" version

    - task: TerraformTask@5
      displayName: Terraform Init for Plan
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: '$(backendResourceGroup)'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: '$(backendContainer)'
        backendAzureRmKey: '$(backendKey)'

    - task: TerraformTask@5
      displayName: Terraform Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: '-input=false -out="$(Build.ArtifactStagingDirectory)/tfplan"'

    - task: PowerShell@2
      displayName: Generate Terraform Plan JSON
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          terraform show `
            -json `
            "$(Build.ArtifactStagingDirectory)/tfplan" |
          Out-File `
            -FilePath "$(Build.ArtifactStagingDirectory)/tfplan.json" `
            -Encoding utf8

    - task: PublishPipelineArtifact@1
      displayName: Publish Raw Terraform Plan
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'terraform-plan-raw'
        publishLocation: 'pipeline'


# =====================================================
# STAGE 8: INFRASTRUCTURE COST ESTIMATION
# =====================================================
- stage: CostEstimation
  displayName: Infracost Estimation
  dependsOn: TerraformPlan
  condition: succeeded()

  jobs:
  - job: InfracostJob
    displayName: Infrastructure Cost Estimation
    pool:
      name: $(agentPool)

    steps:
    - checkout: self
      clean: true

    - task: DownloadPipelineArtifact@2
      displayName: Download Terraform Plan
      inputs:
        artifact: 'terraform-plan-raw'
        path: '$(Pipeline.Workspace)/terraform-plan-raw'

    - task: PowerShell@2
      displayName: Install and Run Infracost
      env:
        INFRACOST_API_KEY: $(INFRACOST_API_KEY)
      inputs:
        targetType: inline
        script: |
          if ([string]::IsNullOrWhiteSpace($env:INFRACOST_API_KEY)) {
            Write-Error "INFRACOST_API_KEY secret variable is missing."
            exit 1
          }

          if (-not (Get-Command infracost -ErrorAction SilentlyContinue)) {
            choco install infracost -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Infracost installation failed."
              exit 1
            }
          }

          infracost breakdown `
            --path "$(Pipeline.Workspace)/terraform-plan-raw/tfplan.json" `
            --format json `
            --out-file "$(Build.ArtifactStagingDirectory)/infracost.json"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Infracost estimation failed."
            exit 1
          }

          infracost output `
            --path "$(Build.ArtifactStagingDirectory)/infracost.json" `
            --format table

    - task: PublishPipelineArtifact@1
      displayName: Publish Infracost Report
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/infracost.json'
        artifact: 'infracost-report'
        publishLocation: 'pipeline'


# =====================================================
# STAGE 9: PLAN ARTIFACT STORAGE
# =====================================================
- stage: PlanArtifact
  displayName: Terraform Plan Artifact Storage
  dependsOn: CostEstimation
  condition: succeeded()

  jobs:
  - job: ArtifactJob
    displayName: Build Deployment Package
    pool:
      name: $(agentPool)

    steps:
    - task: DownloadPipelineArtifact@2
      displayName: Download Terraform Plan
      inputs:
        artifact: 'terraform-plan-raw'
        path: '$(Agent.TempDirectory)/plan-package'

    - task: DownloadPipelineArtifact@2
      displayName: Download Infracost Report
      inputs:
        artifact: 'infracost-report'
        path: '$(Agent.TempDirectory)/plan-package'

    - task: PublishPipelineArtifact@1
      displayName: Publish Approved Deployment Package
      inputs:
        targetPath: '$(Agent.TempDirectory)/plan-package'
        artifact: 'terraform-deployment-package'
        publishLocation: 'pipeline'


# =====================================================
# STAGE 10: MANUAL APPROVAL
# =====================================================
- stage: ManualApproval
  displayName: Manual Approval Gate
  dependsOn: PlanArtifact
  condition: succeeded()

  jobs:
  - job: ApprovalJob
    displayName: Review and Approve Deployment
    pool: server
    timeoutInMinutes: 1440

    steps:
    - task: ManualValidation@1
      displayName: Approve Terraform Apply
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: ''
        instructions: |
          Review:
          1. Terraform Plan
          2. Checkov and tfsec results
          3. Gitleaks results
          4. Terraform Test results
          5. Infracost estimation

          Click Resume to deploy the infrastructure.
        onTimeout: 'reject'


# =====================================================
# STAGE 11: TERRAFORM APPLY
# =====================================================
- stage: TerraformApply
  displayName: Infrastructure Deployment
  dependsOn: ManualApproval
  condition: succeeded()

  jobs:
  - deployment: ApplyJob
    displayName: Terraform Apply
    environment: production
    pool:
      name: $(agentPool)

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self
            clean: true

          - task: DownloadPipelineArtifact@2
            displayName: Download Approved Package
            inputs:
              artifact: 'terraform-deployment-package'
              path: '$(Pipeline.Workspace)/deployment-package'

          - task: PowerShell@2
            displayName: Install Terraform
            inputs:
              targetType: inline
              script: |
                $version = "$(terraformVersion)"
                $directory = "$(Agent.TempDirectory)\terraform-$version"
                $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"
                $zip = "$(Agent.TempDirectory)\terraform-$version.zip"

                if (-not (Test-Path "$directory\terraform.exe")) {
                  New-Item $directory -ItemType Directory -Force | Out-Null
                  Invoke-WebRequest -Uri $url -OutFile $zip
                  Expand-Archive -Path $zip -DestinationPath $directory -Force
                }

                Write-Host "##vso[task.prependpath]$directory"
                & "$directory\terraform.exe" version

          - task: TerraformTask@5
            displayName: Terraform Init for Apply
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingDirectory)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'

          - task: TerraformTask@5
            displayName: Terraform Apply
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '-input=false "$(Pipeline.Workspace)/deployment-package/tfplan"'


# =====================================================
# STAGE 12: POST-DEPLOYMENT VALIDATION
# =====================================================
- stage: PostDeploymentValidation
  displayName: Post-Deployment Validation
  dependsOn: TerraformApply
  condition: succeeded()

  jobs:
  - job: ValidationJob
    displayName: Validate Azure Deployment
    pool:
      name: $(agentPool)

    steps:
    - task: AzureCLI@2
      displayName: Validate Azure Resources
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Connected Azure account:"
          az account show --output table

          Write-Host "Resources currently available in the subscription:"
          az resource list `
            --query "[].{Name:name,Type:type,ResourceGroup:resourceGroup,Location:location}" `
            --output table

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Post-deployment validation failed."
            exit 1
          }


# =====================================================
# STAGE 13: MONITORING AND LOGGING VALIDATION
# =====================================================
- stage: MonitoringValidation
  displayName: Azure Monitoring and Logging
  dependsOn: PostDeploymentValidation
  condition: succeeded()

  jobs:
  - job: MonitoringJob
    displayName: Validate Azure Monitor and Log Analytics
    pool:
      name: $(agentPool)

    steps:
    - task: AzureCLI@2
      displayName: Check Log Analytics Workspaces
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Log Analytics workspaces:"

          az monitor log-analytics workspace list `
            --query "[].{Name:name,ResourceGroup:resourceGroup,Location:location}" `
            --output table

          Write-Host "Azure Monitor metric alerts:"

          az monitor metrics alert list `
            --query "[].{Name:name,ResourceGroup:resourceGroup,Enabled:enabled}" `
            --output table

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Monitoring validation failed."
            exit 1
          }
