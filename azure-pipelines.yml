# ==============================================================================
# Azure DevOps CI/CD Pipeline: Enterprise Terraform Infrastructure Automation
# Agent Pool: akhileshrai
# ==============================================================================

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  terraformVersion: '1.9.5'
  workingDirectory: '$(System.DefaultWorkingDirectory)/Env/Dev'
  azureServiceConnection: 'akhileshinf'

  backendResourceGroup: 'akhileshtestpip'
  backendStorageAccount: 'akhileshstoragepipi1'
  backendContainer: 'akhileshcanttest1'
  backendKey: 'pipe.tfstate'

  agentPool: 'akhileshrai'

stages:

# =====================================================
# STAGE 1: TERRAFORM FMT & LINT SCANNING
# =====================================================
- stage: TerraformLint
  displayName: '1. Terraform Format & Lint Scanning'
  jobs:
  - job: TFLintJob
    displayName: 'Terraform Format & TFLint Scan'
    pool:
      name: akhileshrai
    steps:
    - checkout: self
      clean: true

    - task: PowerShell@2
      displayName: 'Ensure Terraform Installed'
      inputs:
        targetType: inline
        script: |
          $version = "$(terraformVersion)"
          $directory = "$(Agent.TempDirectory)\terraform-$version"
          $zip = "$(Agent.TempDirectory)\terraform-$version.zip"
          $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"

          if (-not (Test-Path "$directory\terraform.exe")) {
            New-Item $directory -ItemType Directory -Force | Out-Null
            Write-Host "Downloading Terraform v$version..."
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $directory -Force
          }
          Write-Host "##vso[task.prependpath]$directory"
          & "$directory\terraform.exe" version

    - task: PowerShell@2
      displayName: 'Run Terraform Format (terraform fmt)'
      continueOnError: true
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          $tfExe = "$(Agent.TempDirectory)\terraform-$(terraformVersion)\terraform.exe"
          if (-not (Test-Path $tfExe)) { $tfExe = "terraform" }
          Write-Host "Auto-formatting Terraform HCL code..."
          & $tfExe fmt -recursive
          $global:LASTEXITCODE = 0

    - task: PowerShell@2
      displayName: 'Install TFLint'
      inputs:
        targetType: inline
        script: |
          if (-not (Get-Command tflint -ErrorAction SilentlyContinue)) {
            Write-Host "Installing TFLint via Chocolatey..."
            choco install tflint -y --no-progress
            if ($LASTEXITCODE -ne 0) { Write-Error "TFLint installation failed."; exit 1 }
          }

    - task: PowerShell@2
      displayName: 'Run TFLint'
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          tflint --init
          if ($LASTEXITCODE -ne 0) { Write-Error "TFLint initialization failed."; exit 1 }
          tflint --recursive --minimum-failure-severity=error
          if ($LASTEXITCODE -ne 0) { Write-Error "TFLint detected ERROR-level Terraform issues."; exit 1 }
          Write-Host "TFLint scan completed with zero errors."


# =====================================================
# STAGE 2: IAC SECURITY SCANNING
# =====================================================
- stage: IaCSecurity
  displayName: '2. Checkov & tfsec Security Scanning'
  dependsOn: TerraformLint
  condition: succeeded()
  jobs:
  - job: IaCSecurityJob
    displayName: 'IaC Security Scan'
    pool:
      name: akhileshrai
    steps:
    - checkout: self
      clean: true

    - task: PowerShell@2
      displayName: 'Install Checkov and tfsec'
      inputs:
        targetType: inline
        script: |
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) { Write-Error "Python is not installed."; exit 1 }
          python -m pip install --upgrade checkov
          if ($LASTEXITCODE -ne 0) { Write-Error "Checkov installation failed."; exit 1 }
          if (-not (Get-Command tfsec -ErrorAction SilentlyContinue)) {
            choco install tfsec -y --no-progress
            if ($LASTEXITCODE -ne 0) { Write-Error "tfsec installation failed."; exit 1 }
          }

    - task: PowerShell@2
      displayName: 'Checkov Security Scan'
      continueOnError: true
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          checkov --directory . --framework terraform --compact --soft-fail
          $global:LASTEXITCODE = 0

    - task: PowerShell@2
      displayName: 'tfsec Security Scan'
      continueOnError: true
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          tfsec . --minimum-severity HIGH --format default
          $global:LASTEXITCODE = 0


# =====================================================
# STAGE 3: SECRET SCANNING
# =====================================================
- stage: SecretScanning
  displayName: '3. Gitleaks Secret Scanning'
  dependsOn: IaCSecurity
  condition: succeeded()
  jobs:
  - job: SecretScanJob
    displayName: 'Gitleaks Scan'
    pool:
      name: akhileshrai
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: PowerShell@2
      displayName: 'Install Gitleaks'
      inputs:
        targetType: inline
        script: |
          if (-not (Get-Command gitleaks -ErrorAction SilentlyContinue)) {
            choco install gitleaks -y --no-progress
            if ($LASTEXITCODE -ne 0) { Write-Error "Gitleaks installation failed."; exit 1 }
          }

    - task: PowerShell@2
      displayName: 'Run Gitleaks Scan'
      inputs:
        targetType: inline
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        script: |
          gitleaks detect --source "$(System.DefaultWorkingDirectory)" --redact --no-banner --verbose --report-format json --report-path "$(Build.ArtifactStagingDirectory)/gitleaks-report.json"
          if ($LASTEXITCODE -ne 0) { Write-Error "Gitleaks detected hardcoded secrets in git history!"; exit 1 }

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Gitleaks Report'
      condition: always()
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/gitleaks-report.json'
        artifact: 'gitleaks-report'
        publishLocation: 'pipeline'


# =====================================================
# STAGE 4: TERRAFORM INIT
# =====================================================
- stage: TerraformInit
  displayName: '4. Terraform Initialization'
  dependsOn: SecretScanning
  condition: succeeded()
  jobs:
  - job: InitJob
    displayName: 'Terraform Init'
    pool:
      name: akhileshrai
    steps:
    - checkout: self
      clean: true

    - task: PowerShell@2
      displayName: 'Ensure Terraform Installed'
      inputs:
        targetType: inline
        script: |
          $version = "$(terraformVersion)"
          $directory = "$(Agent.TempDirectory)\terraform-$version"
          $zip = "$(Agent.TempDirectory)\terraform-$version.zip"
          $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"

          if (-not (Test-Path "$directory\terraform.exe")) {
            New-Item $directory -ItemType Directory -Force | Out-Null
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $directory -Force
          }
          Write-Host "##vso[task.prependpath]$directory"
          & "$directory\terraform.exe" version

    - task: AzureCLI@2
      displayName: 'Terraform Backend Init (via Access Key)'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(workingDirectory)'
        inlineScript: |
          $tfExe = "$(Agent.TempDirectory)\terraform-$(terraformVersion)\terraform.exe"
          if (-not (Test-Path $tfExe)) { $tfExe = "terraform" }

          $accessKey = az storage account keys list --resource-group "$(backendResourceGroup)" --account-name "$(backendStorageAccount)" --query "[0].value" --output tsv
          if ([string]::IsNullOrWhiteSpace($accessKey)) { Write-Error "Failed to retrieve access key."; exit 1 }

          & $tfExe init -backend-config="resource_group_name=$(backendResourceGroup)" -backend-config="storage_account_name=$(backendStorageAccount)" -backend-config="container_name=$(backendContainer)" -backend-config="key=$(backendKey)" -backend-config="access_key=$accessKey" -backend-config="use_azuread_auth=false" -reconfigure
          if ($LASTEXITCODE -ne 0) { Write-Error "Terraform init failed."; exit 1 }


# =====================================================
# STAGE 5: TERRAFORM VALIDATE
# =====================================================
- stage: TerraformValidate
  displayName: '5. Terraform Validation'
  dependsOn: TerraformInit
  condition: succeeded()
  jobs:
  - job: ValidateJob
    displayName: 'Terraform Validate'
    pool:
      name: akhileshrai
    steps:
    - checkout: self
      clean: true

    - task: PowerShell@2
      displayName: 'Ensure Terraform Installed'
      inputs:
        targetType: inline
        script: |
          $version = "$(terraformVersion)"
          $directory = "$(Agent.TempDirectory)\terraform-$version"
          $zip = "$(Agent.TempDirectory)\terraform-$version.zip"
          $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"

          if (-not (Test-Path "$directory\terraform.exe")) {
            New-Item $directory -ItemType Directory -Force | Out-Null
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $directory -Force
          }
          Write-Host "##vso[task.prependpath]$directory"
          & "$directory\terraform.exe" version

    - task: AzureCLI@2
      displayName: 'Terraform Init for Validation'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(workingDirectory)'
        inlineScript: |
          $tfExe = "$(Agent.TempDirectory)\terraform-$(terraformVersion)\terraform.exe"
          if (-not (Test-Path $tfExe)) { $tfExe = "terraform" }
          $accessKey = az storage account keys list --resource-group "$(backendResourceGroup)" --account-name "$(backendStorageAccount)" --query "[0].value" --output tsv
          & $tfExe init -backend-config="resource_group_name=$(backendResourceGroup)" -backend-config="storage_account_name=$(backendStorageAccount)" -backend-config="container_name=$(backendContainer)" -backend-config="key=$(backendKey)" -backend-config="access_key=$accessKey" -backend-config="use_azuread_auth=false" -reconfigure
          if ($LASTEXITCODE -ne 0) { exit 1 }

    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(workingDirectory)'


# =====================================================
# STAGE 6: INFRASTRUCTURE UNIT TESTING
# =====================================================
- stage: InfrastructureTesting
  displayName: '6. Infrastructure Unit Testing'
  dependsOn: TerraformValidate
  condition: succeeded()
  jobs:
  - job: TerraformTestJob
    displayName: 'Terraform Test'
    pool:
      name: akhileshrai
    steps:
    - checkout: self
      clean: true

    - task: PowerShell@2
      displayName: 'Ensure Terraform Installed and Run Unit Tests'
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          $version = "$(terraformVersion)"
          $directory = "$(Agent.TempDirectory)\terraform-$version"
          $zip = "$(Agent.TempDirectory)\terraform-$version.zip"
          $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"

          if (-not (Test-Path "$directory\terraform.exe")) {
            New-Item $directory -ItemType Directory -Force | Out-Null
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $directory -Force
          }

          $testFiles = Get-ChildItem -Path . -Filter "*.tftest.hcl" -Recurse -ErrorAction SilentlyContinue
          if (-not $testFiles) {
            Write-Host "No .tftest.hcl test files found. Skipping terraform test."
            exit 0
          }

          & "$directory\terraform.exe" init -backend=false
          if ($LASTEXITCODE -ne 0) { Write-Error "Local init failed."; exit 1 }
          & "$directory\terraform.exe" test
          if ($LASTEXITCODE -ne 0) { Write-Error "Terraform tests failed."; exit 1 }


# =====================================================
# STAGE 7: TERRAFORM PLAN
# =====================================================
- stage: TerraformPlan
  displayName: '7. Terraform Plan Generation'
  dependsOn: InfrastructureTesting
  condition: succeeded()
  jobs:
  - job: PlanJob
    displayName: 'Generate Terraform Plan'
    pool:
      name: akhileshrai
    steps:
    - checkout: self
      clean: true

    - task: PowerShell@2
      displayName: 'Ensure Terraform Installed'
      inputs:
        targetType: inline
        script: |
          $version = "$(terraformVersion)"
          $directory = "$(Agent.TempDirectory)\terraform-$version"
          $zip = "$(Agent.TempDirectory)\terraform-$version.zip"
          $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"

          if (-not (Test-Path "$directory\terraform.exe")) {
            New-Item $directory -ItemType Directory -Force | Out-Null
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $directory -Force
          }
          Write-Host "##vso[task.prependpath]$directory"
          & "$directory\terraform.exe" version

    - task: AzureCLI@2
      displayName: 'Terraform Init for Plan'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(workingDirectory)'
        inlineScript: |
          $tfExe = "$(Agent.TempDirectory)\terraform-$(terraformVersion)\terraform.exe"
          if (-not (Test-Path $tfExe)) { $tfExe = "terraform" }
          $accessKey = az storage account keys list --resource-group "$(backendResourceGroup)" --account-name "$(backendStorageAccount)" --query "[0].value" --output tsv
          & $tfExe init -backend-config="resource_group_name=$(backendResourceGroup)" -backend-config="storage_account_name=$(backendStorageAccount)" -backend-config="container_name=$(backendContainer)" -backend-config="key=$(backendKey)" -backend-config="access_key=$accessKey" -backend-config="use_azuread_auth=false" -reconfigure
          if ($LASTEXITCODE -ne 0) { exit 1 }

    - task: TerraformTask@5
      displayName: 'Terraform Plan Binary Generation'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: '-input=false -out="$(Build.ArtifactStagingDirectory)/tfplan"'

    - task: PowerShell@2
      displayName: 'Generate UTF-8 (No-BOM) Plan JSON'
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          $tfExe = "$(Agent.TempDirectory)\terraform-$(terraformVersion)\terraform.exe"
          if (-not (Test-Path $tfExe)) { $tfExe = "terraform" }
          $planFile = "$(Build.ArtifactStagingDirectory)/tfplan"
          $jsonFile = "$(Build.ArtifactStagingDirectory)/tfplan.json"

          $json = & $tfExe show -json $planFile
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($json)) { Write-Error "Failed to generate plan JSON."; exit 1 }

          $utf8NoBOM = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($jsonFile, $json, $utf8NoBOM)

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Raw Terraform Plan Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'terraform-plan-raw'
        publishLocation: 'pipeline'


# =====================================================
# STAGE 8: INFRASTRUCTURE COST ESTIMATION
# =====================================================
- stage: CostEstimation
  displayName: '8. Infracost Cost Estimation'
  dependsOn: TerraformPlan
  condition: succeeded()
  jobs:
  - job: InfracostJob
    displayName: 'Infrastructure Cost Estimation'
    continueOnError: true
    pool:
      name: akhileshrai
    steps:
    - checkout: self
      clean: true

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Terraform Plan Artifact'
      inputs:
        artifact: 'terraform-plan-raw'
        path: '$(Pipeline.Workspace)/terraform-plan-raw'

    - task: PowerShell@2
      displayName: 'Install & Run Infracost'
      env:
        INFRACOST_API_KEY: $(INFRACOST_API_KEY)
      inputs:
        targetType: inline
        script: |
          if ([string]::IsNullOrWhiteSpace($env:INFRACOST_API_KEY)) { Write-Error "INFRACOST_API_KEY secret missing."; exit 1 }
          if (-not (Get-Command infracost -ErrorAction SilentlyContinue)) {
            choco install infracost -y --no-progress
            if ($LASTEXITCODE -ne 0) { Write-Error "Infracost installation failed."; exit 1 }
          }
          infracost breakdown --path "$(Pipeline.Workspace)/terraform-plan-raw/tfplan.json" --format json --out-file "$(Build.ArtifactStagingDirectory)/infracost.json"
          if ($LASTEXITCODE -ne 0) { Write-Error "Infracost failed."; exit 1 }
          infracost output --path "$(Build.ArtifactStagingDirectory)/infracost.json" --format table

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Infracost Report Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/infracost.json'
        artifact: 'infracost-report'
        publishLocation: 'pipeline'


# =====================================================
# STAGE 9: PLAN ARTIFACT STORAGE
# =====================================================
- stage: PlanArtifact
  displayName: '9. Deployment Package Storage'
  dependsOn: CostEstimation
  condition: succeeded()
  jobs:
  - job: ArtifactJob
    displayName: 'Build Deployment Package'
    pool:
      name: akhileshrai
    steps:
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Plan Artifact'
      inputs:
        artifact: 'terraform-plan-raw'
        path: '$(Agent.TempDirectory)/plan-package'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Cost Report'
      inputs:
        artifact: 'infracost-report'
        path: '$(Agent.TempDirectory)/plan-package'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Approved Deployment Package'
      inputs:
        targetPath: '$(Agent.TempDirectory)/plan-package'
        artifact: 'terraform-deployment-package'
        publishLocation: 'pipeline'


# =====================================================
# STAGE 10: MANUAL APPROVAL
# =====================================================
- stage: ManualApproval
  displayName: '10. Manual Approval Gate'
  dependsOn: PlanArtifact
  condition: succeeded()
  jobs:
  - job: ApprovalJob
    displayName: 'Review and Approve Deployment'
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@1
      displayName: 'Approve Infrastructure Apply'
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: ''
        instructions: |
          Please review the following artifacts before approving deployment:
          1. Terraform Execution Plan (tfplan.json)
          2. Checkov & tfsec Security Scan Results
          3. Gitleaks Secret Detection Findings
          4. Infrastructure Unit Test Results (*.tftest.hcl)
          5. Infracost Breakdown Report

          Click 'Resume' to proceed with production deployment.
        onTimeout: 'reject'


# =====================================================
# STAGE 11: TERRAFORM APPLY
# =====================================================
- stage: TerraformApply
  displayName: '11. Infrastructure Deployment (Apply)'
  dependsOn: ManualApproval
  condition: succeeded()
  jobs:
  - deployment: ApplyJob
    displayName: 'Terraform Apply'
    environment: production
    pool:
      name: akhileshrai
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            clean: true

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Approved Deployment Package'
            inputs:
              artifact: 'terraform-deployment-package'
              path: '$(Pipeline.Workspace)/deployment-package'

          - task: PowerShell@2
            displayName: 'Ensure Terraform Installed'
            inputs:
              targetType: inline
              script: |
                $version = "$(terraformVersion)"
                $directory = "$(Agent.TempDirectory)\terraform-$version"
                $zip = "$(Agent.TempDirectory)\terraform-$version.zip"
                $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"

                if (-not (Test-Path "$directory\terraform.exe")) {
                  New-Item $directory -ItemType Directory -Force | Out-Null
                  Invoke-WebRequest -Uri $url -OutFile $zip
                  Expand-Archive -Path $zip -DestinationPath $directory -Force
                }
                Write-Host "##vso[task.prependpath]$directory"
                & "$directory\terraform.exe" version

          - task: AzureCLI@2
            displayName: 'Terraform Init for Apply'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(workingDirectory)'
              inlineScript: |
                $tfExe = "$(Agent.TempDirectory)\terraform-$(terraformVersion)\terraform.exe"
                if (-not (Test-Path $tfExe)) { $tfExe = "terraform" }
                $accessKey = az storage account keys list --resource-group "$(backendResourceGroup)" --account-name "$(backendStorageAccount)" --query "[0].value" --output tsv
                & $tfExe init -backend-config="resource_group_name=$(backendResourceGroup)" -backend-config="storage_account_name=$(backendStorageAccount)" -backend-config="container_name=$(backendContainer)" -backend-config="key=$(backendKey)" -backend-config="access_key=$accessKey" -backend-config="use_azuread_auth=false" -reconfigure
                if ($LASTEXITCODE -ne 0) { exit 1 }

          - task: TerraformTask@5
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '-input=false "$(Pipeline.Workspace)/deployment-package/tfplan"'


# =====================================================
# STAGE 12: POST-DEPLOYMENT VALIDATION
# =====================================================
- stage: PostDeploymentValidation
  displayName: '12. Post-Deployment Azure Validation'
  dependsOn: TerraformApply
  condition: succeeded()
  jobs:
  - job: ValidationJob
    displayName: 'Validate Azure Resources'
    pool:
      name: akhileshrai
    steps:
    - task: AzureCLI@2
      displayName: 'Audit Active Subscription Resources'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Active Azure Subscription Account:"
          az account show --output table
          Write-Host "Deployed Resources in Subscription:"
          az resource list --query "[].{Name:name,Type:type,ResourceGroup:resourceGroup,Location:location}" --output table
          if ($LASTEXITCODE -ne 0) { Write-Error "Post-deployment validation failed."; exit 1 }


# =====================================================
# STAGE 13: MONITORING AND LOGGING VALIDATION
# =====================================================
- stage: MonitoringValidation
  displayName: '13. Azure Monitoring & Logging Audit'
  dependsOn: PostDeploymentValidation
  condition: succeeded()
  jobs:
  - job: MonitoringJob
    displayName: 'Validate Log Analytics & Metric Alerts'
    pool:
      name: akhileshrai
    steps:
    - task: AzureCLI@2
      displayName: 'Audit Log Analytics & Metric Alerts'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Active Log Analytics Workspaces:"
          az monitor log-analytics workspace list --query "[].{Name:name,ResourceGroup:resourceGroup,Location:location}" --output table
          Write-Host "Configured Azure Monitor Metric Alerts:"
          az monitor metrics alert list --query "[].{Name:name,ResourceGroup:resourceGroup,Enabled:enabled}" --output table
          if ($LASTEXITCODE -ne 0) { Write-Error "Monitoring & logging validation failed."; exit 1 }
