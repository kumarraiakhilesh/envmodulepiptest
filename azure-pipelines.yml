trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  terraformVersion: '1.15.9'
  workingDirectory: '$(System.DefaultWorkingDirectory)/Env/Dev'
  azureServiceConnection: 'akhileshinf'

  # Terraform Remote Backend
  backendResourceGroup: 'akhileshtestpip'
  backendStorageAccount: 'akhileshstoragepipi1'
  backendContainer: 'akhileshcanttest1'
  backendKey: 'pipe.tfstate'

stages:

# =====================================================
# STAGE 1: TERRAFORM INIT AND VALIDATE
# =====================================================
- stage: TerraformValidate
  displayName: Terraform Init and Validate

  jobs:

  - job: TerraformValidateJob
    displayName: Terraform Init and Validate

    pool:
      name: akhileshrai

    steps:

    - checkout: self
      clean: true

    # Install Terraform directly
    - task: PowerShell@2
      displayName: Download and Install Terraform
      inputs:
        targetType: inline
        script: |
          $version = "$(terraformVersion)"
          $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"
          $zipFile = "$(Agent.TempDirectory)\terraform-$version.zip"
          $installDirectory = "$(Agent.TempDirectory)\terraform-$version"

          if (Test-Path $zipFile) {
            Remove-Item -Path $zipFile -Force
          }

          if (Test-Path $installDirectory) {
            Remove-Item -Path $installDirectory -Recurse -Force
          }

          New-Item -Path $installDirectory -ItemType Directory -Force | Out-Null

          Invoke-WebRequest -Uri $url -OutFile $zipFile

          if (-not (Test-Path $zipFile)) {
            Write-Error "Terraform ZIP download failed."
            exit 1
          }

          Expand-Archive `
            -Path $zipFile `
            -DestinationPath $installDirectory `
            -Force

          $terraformExe = Join-Path $installDirectory "terraform.exe"

          if (-not (Test-Path $terraformExe)) {
            Write-Error "terraform.exe was not found."
            exit 1
          }

          Write-Host "##vso[task.prependpath]$installDirectory"

          & $terraformExe version

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform verification failed."
            exit 1
          }

    # Terraform Init
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: '$(backendResourceGroup)'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: '$(backendContainer)'
        backendAzureRmKey: '$(backendKey)'

    # Terraform Validate
    - task: TerraformTask@5
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(workingDirectory)'


# =====================================================
# STAGE 2: INFRASTRUCTURE SECURITY SCANS
# =====================================================
- stage: SecurityScanning
  displayName: Infrastructure Security Scanning
  dependsOn: TerraformValidate
  condition: succeeded()

  jobs:

  - job: SecurityScanningJob
    displayName: TFLint, tfsec, Checkov and Gitleaks

    pool:
      name: akhileshrai

    steps:

    - checkout: self
      clean: true
      fetchDepth: 0

    # Install Security Scanners
    - task: PowerShell@2
      displayName: Install Security Scanning Tools
      inputs:
        targetType: inline
        script: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Error "Chocolatey is not installed on the agent."
            exit 1
          }

          if (-not (Get-Command tflint -ErrorAction SilentlyContinue)) {
            Write-Host "Installing TFLint..."

            choco install tflint -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              Write-Error "TFLint installation failed."
              exit 1
            }
          }

          if (-not (Get-Command tfsec -ErrorAction SilentlyContinue)) {
            Write-Host "Installing tfsec..."

            choco install tfsec -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              Write-Error "tfsec installation failed."
              exit 1
            }
          }

          if (-not (Get-Command gitleaks -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Gitleaks..."

            choco install gitleaks -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Gitleaks installation failed."
              exit 1
            }
          }

          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            Write-Error "Python is not installed on the agent."
            exit 1
          }

          Write-Host "Installing Checkov..."

          python -m pip install --upgrade checkov

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Checkov installation failed."
            exit 1
          }

    # TFLint Scan
    - task: PowerShell@2
      displayName: TFLint Scan
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          tflint --init

          if ($LASTEXITCODE -ne 0) {
            Write-Error "TFLint initialization failed."
            exit 1
          }

          tflint --recursive

          if ($LASTEXITCODE -ne 0) {
            Write-Error "TFLint detected Terraform code issues."
            exit 1
          }

    # tfsec Scan
    - task: PowerShell@2
      displayName: tfsec Infrastructure Security Scan
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          tfsec . `
            --minimum-severity HIGH `
            --format default

          if ($LASTEXITCODE -ne 0) {
            Write-Error "tfsec detected HIGH or CRITICAL security issues."
            exit 1
          }

    # Checkov Scan
    - task: PowerShell@2
      displayName: Checkov IaC Security Scan
      inputs:
        targetType: inline
        workingDirectory: '$(workingDirectory)'
        script: |
          python -m checkov.main `
            --directory . `
            --framework terraform `
            --compact `
            --soft-fail-on MEDIUM,LOW

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Checkov detected blocking security issues."
            exit 1
          }

    # Gitleaks Scan
    - task: PowerShell@2
      displayName: Gitleaks Secret Scan
      inputs:
        targetType: inline
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        script: |
          gitleaks detect `
            --source "$(System.DefaultWorkingDirectory)" `
            --no-banner `
            --redact `
            --verbose

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Gitleaks detected credentials or secrets."
            exit 1
          }


# =====================================================
# STAGE 3: TERRAFORM PLAN
# =====================================================
- stage: TerraformPlan
  displayName: Terraform Plan
  dependsOn: SecurityScanning
  condition: succeeded()

  jobs:

  - job: TerraformPlanJob
    displayName: Generate Terraform Plan

    pool:
      name: akhileshrai

    steps:

    - checkout: self
      clean: true

    # Install Terraform
    - task: PowerShell@2
      displayName: Download and Install Terraform
      inputs:
        targetType: inline
        script: |
          $version = "$(terraformVersion)"
          $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"
          $zipFile = "$(Agent.TempDirectory)\terraform-$version.zip"
          $installDirectory = "$(Agent.TempDirectory)\terraform-$version"

          if (Test-Path $zipFile) {
            Remove-Item -Path $zipFile -Force
          }

          if (Test-Path $installDirectory) {
            Remove-Item -Path $installDirectory -Recurse -Force
          }

          New-Item -Path $installDirectory -ItemType Directory -Force | Out-Null

          Invoke-WebRequest -Uri $url -OutFile $zipFile

          if (-not (Test-Path $zipFile)) {
            Write-Error "Terraform ZIP download failed."
            exit 1
          }

          Expand-Archive `
            -Path $zipFile `
            -DestinationPath $installDirectory `
            -Force

          $terraformExe = Join-Path $installDirectory "terraform.exe"

          if (-not (Test-Path $terraformExe)) {
            Write-Error "terraform.exe was not found."
            exit 1
          }

          Write-Host "##vso[task.prependpath]$installDirectory"

          & $terraformExe version

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform verification failed."
            exit 1
          }

    # Terraform Init for Plan
    - task: TerraformTask@5
      displayName: Terraform Init for Plan
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: '$(backendResourceGroup)'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: '$(backendContainer)'
        backendAzureRmKey: '$(backendKey)'

    # Terraform Plan
    - task: TerraformTask@5
      displayName: Terraform Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: '-input=false -out="$(Build.ArtifactStagingDirectory)/tfplan"'

    # Publish Plan
    - task: PublishPipelineArtifact@1
      displayName: Publish Terraform Plan
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'


# =====================================================
# STAGE 4: MANUAL APPROVAL
# =====================================================
- stage: ManualApproval
  displayName: Manual Approval
  dependsOn: TerraformPlan
  condition: succeeded()

  jobs:

  - job: WaitForApproval
    displayName: Review and Approve Terraform Plan

    pool: server
    timeoutInMinutes: 1440

    steps:

    - task: ManualValidation@1
      displayName: Approve Infrastructure Deployment
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: ''
        instructions: |
          Please review the Terraform Plan and security scan results.

          Verify:
          1. Resources being created, changed or destroyed
          2. Network and security configuration
          3. Resource names and Azure regions
          4. Infrastructure cost
          5. TFLint, tfsec, Checkov and Gitleaks results

          Click Resume to execute Terraform Apply.
        onTimeout: 'reject'


# =====================================================
# STAGE 5: TERRAFORM APPLY
# =====================================================
- stage: TerraformApply
  displayName: Terraform Apply
  dependsOn: ManualApproval
  condition: succeeded()

  jobs:

  - deployment: TerraformApplyJob
    displayName: Deploy Azure Infrastructure

    environment: production

    pool:
      name: akhileshrai

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self
            clean: true

          # Download approved plan
          - task: DownloadPipelineArtifact@2
            displayName: Download Approved Terraform Plan
            inputs:
              artifact: 'terraform-plan'
              path: '$(Pipeline.Workspace)/terraform-plan'

          # Install Terraform
          - task: PowerShell@2
            displayName: Download and Install Terraform
            inputs:
              targetType: inline
              script: |
                $version = "$(terraformVersion)"
                $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"
                $zipFile = "$(Agent.TempDirectory)\terraform-$version.zip"
                $installDirectory = "$(Agent.TempDirectory)\terraform-$version"

                if (Test-Path $zipFile) {
                  Remove-Item -Path $zipFile -Force
                }

                if (Test-Path $installDirectory) {
                  Remove-Item -Path $installDirectory -Recurse -Force
                }

                New-Item -Path $installDirectory -ItemType Directory -Force | Out-Null

                Invoke-WebRequest -Uri $url -OutFile $zipFile

                if (-not (Test-Path $zipFile)) {
                  Write-Error "Terraform ZIP download failed."
                  exit 1
                }

                Expand-Archive `
                  -Path $zipFile `
                  -DestinationPath $installDirectory `
                  -Force

                $terraformExe = Join-Path $installDirectory "terraform.exe"

                if (-not (Test-Path $terraformExe)) {
                  Write-Error "terraform.exe was not found."
                  exit 1
                }

                Write-Host "##vso[task.prependpath]$installDirectory"

                & $terraformExe version

                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Terraform verification failed."
                  exit 1
                }

          # Terraform Init for Apply
          - task: TerraformTask@5
            displayName: Terraform Init for Apply
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingDirectory)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'

          # Terraform Apply
          - task: TerraformTask@5
            displayName: Terraform Apply
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '-input=false "$(Pipeline.Workspace)/terraform-plan/tfplan"'