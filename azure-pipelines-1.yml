trigger: none

pool:
  name: Akhilesh

variables:
  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/infra'

  # Deployment के बाद application की वास्तविक URL डालें
  # Example: https://myapp.azurewebsites.net
  dastTargetUrl: 'https://your-application-url.com'

jobs:

# ============================================================
# JOB 1: INIT, VALIDATE, SAST/IAC SCANS AND PLAN
# ============================================================
- job: TerraformPlan
  displayName: Terraform Security Scan and Plan

  steps:

  - checkout: self
    clean: true
    fetchDepth: 0

  # ----------------------------------------------------------
  # Install Terraform
  # ----------------------------------------------------------
  - task: TerraformInstaller@1
    displayName: Install Terraform
    inputs:
      terraformVersion: 'latest'

  # ----------------------------------------------------------
  # Terraform Init
  # ----------------------------------------------------------
  - task: TerraformTask@5
    displayName: Terraform Init
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(terraformWorkingDirectory)'
      backendServiceArm: 'akhilesh25'
      backendAzureRmResourceGroupName: 'akhileshtestpip'
      backendAzureRmStorageAccountName: 'akhileshstoragepipi'
      backendAzureRmContainerName: 'akhileshcanttest1'
      backendAzureRmKey: 'pipe.tfstate'

  # ----------------------------------------------------------
  # Terraform Format Check
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: Terraform Format Check
    inputs:
      targetType: inline
      workingDirectory: '$(terraformWorkingDirectory)'
      script: |
        terraform fmt -check -recursive

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform formatting check failed."
          exit 1
        }

  # ----------------------------------------------------------
  # Terraform Validate
  # ----------------------------------------------------------
  - task: TerraformTask@5
    displayName: Terraform Validate
    inputs:
      provider: 'azurerm'
      command: 'validate'
      workingDirectory: '$(terraformWorkingDirectory)'

  # ----------------------------------------------------------
  # Install infrastructure security tools
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: Install Security Scanning Tools
    inputs:
      targetType: inline
      script: |
        Write-Host "Installing TFLint, tfsec and Gitleaks..."

        choco install tflint -y --no-progress
        if ($LASTEXITCODE -ne 0) {
          Write-Error "TFLint installation failed."
          exit 1
        }

        choco install tfsec -y --no-progress
        if ($LASTEXITCODE -ne 0) {
          Write-Error "tfsec installation failed."
          exit 1
        }

        choco install gitleaks -y --no-progress
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Gitleaks installation failed."
          exit 1
        }

        Write-Host "Installing Checkov..."
        python -m pip install --upgrade pip
        python -m pip install checkov

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Checkov installation failed."
          exit 1
        }

  # ----------------------------------------------------------
  # TFLint – Terraform code quality scan
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: TFLint Security and Quality Scan
    inputs:
      targetType: inline
      workingDirectory: '$(terraformWorkingDirectory)'
      script: |
        tflint --init

        if ($LASTEXITCODE -ne 0) {
          Write-Error "TFLint initialization failed."
          exit 1
        }

        tflint --recursive

        if ($LASTEXITCODE -ne 0) {
          Write-Error "TFLint detected code issues."
          exit 1
        }

  # ----------------------------------------------------------
  # tfsec – Terraform security misconfiguration scan
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: tfsec Infrastructure Security Scan
    inputs:
      targetType: inline
      workingDirectory: '$(terraformWorkingDirectory)'
      script: |
        tfsec . `
          --format default `
          --minimum-severity HIGH

        if ($LASTEXITCODE -ne 0) {
          Write-Error "tfsec detected HIGH or CRITICAL security issues."
          exit 1
        }

  # ----------------------------------------------------------
  # Checkov – Policy and compliance scan
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: Checkov Policy and Compliance Scan
    inputs:
      targetType: inline
      workingDirectory: '$(terraformWorkingDirectory)'
      script: |
        checkov `
          --directory . `
          --framework terraform `
          --compact `
          --quiet `
          --soft-fail-on MEDIUM

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Checkov detected blocking security issues."
          exit 1
        }

  # ----------------------------------------------------------
  # Gitleaks – Secrets scan
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: Gitleaks Secret Scan
    inputs:
      targetType: inline
      workingDirectory: '$(System.DefaultWorkingDirectory)'
      script: |
        gitleaks detect `
          --source "$(System.DefaultWorkingDirectory)" `
          --no-banner `
          --redact `
          --verbose

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Gitleaks detected credentials or secrets."
          exit 1
        }

  # ----------------------------------------------------------
  # Terraform Plan
  # Runs only when all security scans pass
  # ----------------------------------------------------------
  - task: TerraformTask@5
    displayName: Terraform Plan
    inputs:
      provider: 'azurerm'
      command: 'plan'
      workingDirectory: '$(terraformWorkingDirectory)'
      environmentServiceNameAzureRM: 'akhilesh25'
      commandOptions: '-out=tfplan'

  # ----------------------------------------------------------
  # Publish approved Terraform plan
  # ----------------------------------------------------------
  - task: PublishPipelineArtifact@1
    displayName: Publish Terraform Plan
    inputs:
      targetPath: '$(terraformWorkingDirectory)/tfplan'
      artifact: 'terraform-plan'
      publishLocation: 'pipeline'


# ============================================================
# JOB 2: MANUAL APPROVAL
# ============================================================
- job: ManualApproval
  displayName: Manual Approval
  dependsOn: TerraformPlan
  condition: succeeded()
  pool: server
  timeoutInMinutes: 1440

  steps:

  - task: ManualValidation@1
    displayName: Approve Terraform Deployment
    timeoutInMinutes: 1440
    inputs:
      notifyUsers: ''
      instructions: |
        Terraform validation and security scans have passed.

        Please review:
        1. Terraform Plan
        2. TFLint results
        3. tfsec results
        4. Checkov results
        5. Gitleaks results

        Click Resume to run Terraform Apply.
      onTimeout: reject


# ============================================================
# JOB 3: TERRAFORM APPLY
# ============================================================
- job: TerraformApply
  displayName: Terraform Apply
  dependsOn: ManualApproval
  condition: succeeded()

  pool:
    name: Akhilesh

  steps:

  - checkout: self
    clean: true

  - task: TerraformInstaller@1
    displayName: Install Terraform
    inputs:
      terraformVersion: 'latest'

  - task: TerraformTask@5
    displayName: Terraform Re-Init
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(terraformWorkingDirectory)'
      backendServiceArm: 'akhilesh25'
      backendAzureRmResourceGroupName: 'akhileshtestpip'
      backendAzureRmStorageAccountName: 'akhileshstoragepipi'
      backendAzureRmContainerName: 'akhileshcanttest1'
      backendAzureRmKey: 'pipe.tfstate'

  - task: DownloadPipelineArtifact@2
    displayName: Download Approved Terraform Plan
    inputs:
      artifact: 'terraform-plan'
      path: '$(terraformWorkingDirectory)'

  - task: TerraformTask@5
    displayName: Terraform Apply
    inputs:
      provider: 'azurerm'
      command: 'apply'
      workingDirectory: '$(terraformWorkingDirectory)'
      environmentServiceNameAzureRM: 'akhilesh25'
      commandOptions: '-auto-approve tfplan'


# ============================================================
# JOB 4: DAST SCAN AFTER DEPLOYMENT
# ============================================================
- job: DASTScan
  displayName: OWASP ZAP DAST Scan
  dependsOn: TerraformApply
  condition: succeeded()

  pool:
    name: Akhilesh

  steps:

  - task: PowerShell@2
    displayName: Verify Docker
    inputs:
      targetType: inline
      script: |
        docker version

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Docker is not installed or Docker Engine is not running."
          exit 1
        }

  - task: PowerShell@2
    displayName: OWASP ZAP Baseline Scan
    inputs:
      targetType: inline
      script: |
        $targetUrl = "$(dastTargetUrl)"

        if (
          [string]::IsNullOrWhiteSpace($targetUrl) -or
          $targetUrl -eq "https://your-application-url.com"
        ) {
          Write-Error "Please configure dastTargetUrl with the deployed application URL."
          exit 1
        }

        docker pull zaproxy/zap-stable

        docker run --rm `
          -v "$(System.DefaultWorkingDirectory):/zap/wrk/:rw" `
          zaproxy/zap-stable `
          zap-baseline.py `
          -t $targetUrl `
          -r zap-report.html `
          -I

        if ($LASTEXITCODE -ne 0) {
          Write-Error "OWASP ZAP detected blocking vulnerabilities."
          exit 1
        }

  - task: PublishPipelineArtifact@1
    displayName: Publish OWASP ZAP Report
    condition: always()
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/zap-report.html'
      artifact: 'owasp-zap-report'
      publishLocation: pipeline