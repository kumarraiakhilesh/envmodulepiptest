trigger: none

variables:
  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/infra'
  terraformVersion: '1.15.9'

  # DAST चलाने के लिए true करें और वास्तविक URL डालें
  runDAST: 'false'
  dastTargetUrl: 'https://your-application-url.com'

jobs:

# ============================================================
# JOB 1: SECURITY SCANS AND TERRAFORM PLAN
# ============================================================
- job: TerraformPlan
  displayName: Security Scans and Terraform Plan

  pool:
    name: Akhilesh

  steps:

  - checkout: self
    clean: true
    fetchDepth: 0

  # Corrupt Terraform tool-cache repair
  - task: PowerShell@2
    displayName: Repair Terraform Tool Cache
    inputs:
      targetType: inline
      script: |
        $versionDirectory = "$(Agent.ToolsDirectory)\terraform\$(terraformVersion)"
        $terraformExe = "$versionDirectory\x64\terraform.exe"

        Write-Host "Checking Terraform cache: $versionDirectory"

        if ((Test-Path $versionDirectory) -and
            (-not (Test-Path $terraformExe))) {

          Write-Warning "Incomplete Terraform cache detected."
          Write-Warning "Removing: $versionDirectory"

          Remove-Item `
            -Path $versionDirectory `
            -Recurse `
            -Force

          Write-Host "Corrupt Terraform cache removed."
        }
        else {
          Write-Host "No corrupt Terraform cache detected."
        }

  # Install Terraform
  - task: TerraformInstaller@1
    displayName: Install Terraform
    inputs:
      terraformVersion: '$(terraformVersion)'

  # Verify Terraform installation
  - task: PowerShell@2
    displayName: Verify Terraform Installation
    inputs:
      targetType: inline
      script: |
        $terraformCommand = Get-Command terraform `
          -ErrorAction SilentlyContinue

        if (-not $terraformCommand) {
          Write-Error "terraform.exe is not installed or not available in PATH."
          exit 1
        }

        Write-Host "Terraform executable:"
        Write-Host $terraformCommand.Source

        terraform version

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform executable could not be started."
          exit 1
        }

  # Terraform Init
  - task: TerraformTask@5
    displayName: Terraform Init
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(terraformWorkingDirectory)'
      backendServiceArm: 'akhilesh25'
      backendAzureRmResourceGroupName: 'akhileshtestpip'
      backendAzureRmStorageAccountName: 'akhileshstoragepipi1'
      backendAzureRmContainerName: 'akhileshcanttest1'
      backendAzureRmKey: 'pipe.tfstate'

  # Terraform Format
  - task: PowerShell@2
    displayName: Terraform Format Check
    inputs:
      targetType: inline
      workingDirectory: '$(terraformWorkingDirectory)'
      script: |
        terraform fmt -check -recursive

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform files are not formatted."
          Write-Host "Run: terraform fmt -recursive"
          exit 1
        }

  # Terraform Validate
  - task: TerraformTask@5
    displayName: Terraform Validate
    inputs:
      provider: 'azurerm'
      command: 'validate'
      workingDirectory: '$(terraformWorkingDirectory)'

  # Install security tools
  - task: PowerShell@2
    displayName: Install Security Scanning Tools
    inputs:
      targetType: inline
      script: |
        if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
          Write-Error "Chocolatey is not installed on the agent."
          exit 1
        }

        if (-not (Get-Command tflint -ErrorAction SilentlyContinue)) {
          Write-Host "Installing TFLint..."
          choco install tflint -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            Write-Error "TFLint installation failed."
            exit 1
          }
        }

        if (-not (Get-Command tfsec -ErrorAction SilentlyContinue)) {
          Write-Host "Installing tfsec..."
          choco install tfsec -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            Write-Error "tfsec installation failed."
            exit 1
          }
        }

        if (-not (Get-Command gitleaks -ErrorAction SilentlyContinue)) {
          Write-Host "Installing Gitleaks..."
          choco install gitleaks -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Gitleaks installation failed."
            exit 1
          }
        }

        Write-Host "Installing Checkov..."
        python -m pip install --upgrade pip
        python -m pip install --upgrade checkov

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Checkov installation failed."
          exit 1
        }

  # TFLint scan
  - task: PowerShell@2
    displayName: TFLint Scan
    inputs:
      targetType: inline
      workingDirectory: '$(terraformWorkingDirectory)'
      script: |
        tflint --init

        if ($LASTEXITCODE -ne 0) {
          Write-Error "TFLint initialization failed."
          exit 1
        }

        tflint --recursive

        if ($LASTEXITCODE -ne 0) {
          Write-Error "TFLint detected Terraform issues."
          exit 1
        }

  # tfsec scan
  - task: PowerShell@2
    displayName: tfsec Security Scan
    inputs:
      targetType: inline
      workingDirectory: '$(terraformWorkingDirectory)'
      script: |
        tfsec . `
          --format default `
          --minimum-severity HIGH

        if ($LASTEXITCODE -ne 0) {
          Write-Error "tfsec detected HIGH or CRITICAL security issues."
          exit 1
        }

  # Checkov scan
  - task: PowerShell@2
    displayName: Checkov Compliance Scan
    inputs:
      targetType: inline
      workingDirectory: '$(terraformWorkingDirectory)'
      script: |
        checkov `
          --directory . `
          --framework terraform `
          --compact `
          --quiet `
          --soft-fail-on MEDIUM

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Checkov detected blocking security issues."
          exit 1
        }

  # Gitleaks scan
  - task: PowerShell@2
    displayName: Gitleaks Secret Scan
    inputs:
      targetType: inline
      workingDirectory: '$(System.DefaultWorkingDirectory)'
      script: |
        gitleaks detect `
          --source "$(System.DefaultWorkingDirectory)" `
          --no-banner `
          --redact `
          --verbose

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Gitleaks detected credentials or secrets."
          exit 1
        }

  # Terraform Plan
  - task: TerraformTask@5
    displayName: Terraform Plan
    inputs:
      provider: 'azurerm'
      command: 'plan'
      workingDirectory: '$(terraformWorkingDirectory)'
      environmentServiceNameAzureRM: 'akhilesh25'
      commandOptions: '-out=tfplan'

  # Publish Plan
  - task: PublishPipelineArtifact@1
    displayName: Publish Terraform Plan
    inputs:
      targetPath: '$(terraformWorkingDirectory)/tfplan'
      artifact: 'terraform-plan'
      publishLocation: 'pipeline'


# ============================================================
# JOB 2: MANUAL APPROVAL
# ============================================================
- job: ManualApproval
  displayName: Manual Approval
  dependsOn: TerraformPlan
  condition: succeeded()

  pool: server
  timeoutInMinutes: 1440

  steps:

  - task: ManualValidation@1
    displayName: Approve Terraform Apply
    timeoutInMinutes: 1440
    inputs:
      notifyUsers: ''
      instructions: |
        Terraform validation and security scans passed.

        Review:
        1. Terraform Plan
        2. TFLint results
        3. tfsec results
        4. Checkov results
        5. Gitleaks results

        Click Resume to deploy the infrastructure.
      onTimeout: 'reject'


# ============================================================
# JOB 3: TERRAFORM APPLY
# ============================================================
- job: TerraformApply
  displayName: Terraform Apply
  dependsOn: ManualApproval
  condition: succeeded()

  pool:
    name: Akhilesh

  steps:

  - checkout: self
    clean: true

  # Repair cache if required
  - task: PowerShell@2
    displayName: Repair Terraform Tool Cache
    inputs:
      targetType: inline
      script: |
        $versionDirectory = "$(Agent.ToolsDirectory)\terraform\$(terraformVersion)"
        $terraformExe = "$versionDirectory\x64\terraform.exe"

        if ((Test-Path $versionDirectory) -and
            (-not (Test-Path $terraformExe))) {

          Write-Warning "Incomplete Terraform cache detected."

          Remove-Item `
            -Path $versionDirectory `
            -Recurse `
            -Force
        }

  - task: TerraformInstaller@1
    displayName: Install Terraform
    inputs:
      terraformVersion: '$(terraformVersion)'

  - task: PowerShell@2
    displayName: Verify Terraform Installation
    inputs:
      targetType: inline
      script: |
        $terraformCommand = Get-Command terraform `
          -ErrorAction SilentlyContinue

        if (-not $terraformCommand) {
          Write-Error "terraform.exe is not available."
          exit 1
        }

        Write-Host $terraformCommand.Source
        terraform version

  # Terraform Re-Init
  - task: TerraformTask@5
    displayName: Terraform Re-Init
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(terraformWorkingDirectory)'
      backendServiceArm: 'akhilesh25'
      backendAzureRmResourceGroupName: 'akhileshtestpip'
      backendAzureRmStorageAccountName: 'akhileshstoragepipi1'
      backendAzureRmContainerName: 'akhileshcanttest1'
      backendAzureRmKey: 'pipe.tfstate'

  # Download exact approved plan
  - task: DownloadPipelineArtifact@2
    displayName: Download Approved Terraform Plan
    inputs:
      artifact: 'terraform-plan'
      path: '$(terraformWorkingDirectory)'

  # Apply exact approved plan
  - task: TerraformTask@5
    displayName: Terraform Apply
    inputs:
      provider: 'azurerm'
      command: 'apply'
      workingDirectory: '$(terraformWorkingDirectory)'
      environmentServiceNameAzureRM: 'akhilesh25'
      commandOptions: '-auto-approve tfplan'


# ============================================================
# JOB 4: OPTIONAL DAST SCAN
# ============================================================
- job: DASTScan
  displayName: OWASP ZAP DAST Scan
  dependsOn: TerraformApply
  condition: |
    and(
      succeeded(),
      eq(variables['runDAST'], 'true')
    )

  pool:
    name: Akhilesh

  steps:

  - task: PowerShell@2
    displayName: Validate DAST Configuration
    inputs:
      targetType: inline
      script: |
        $targetUrl = "$(dastTargetUrl)"

        if ($targetUrl -eq "https://your-application-url.com") {
          Write-Error "Configure dastTargetUrl with the deployed application URL."
          exit 1
        }

        docker version

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Docker is not installed or Docker Engine is not running."
          exit 1
        }

  - task: PowerShell@2
    displayName: OWASP ZAP Baseline Scan
    inputs:
      targetType: inline
      script: |
        docker pull zaproxy/zap-stable

        if ($LASTEXITCODE -ne 0) {
          Write-Error "OWASP ZAP image download failed."
          exit 1
        }

        docker run --rm `
          -v "$(System.DefaultWorkingDirectory):/zap/wrk/:rw" `
          zaproxy/zap-stable `
          zap-baseline.py `
          -t "$(dastTargetUrl)" `
          -r zap-report.html `
          -I

        if ($LASTEXITCODE -ne 0) {
          Write-Error "OWASP ZAP scan failed."
          exit 1
        }

  - task: PublishPipelineArtifact@1
    displayName: Publish OWASP ZAP Report
    condition: always()
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/zap-report.html'
      artifact: 'owasp-zap-report'
      publishLocation: 'pipeline'