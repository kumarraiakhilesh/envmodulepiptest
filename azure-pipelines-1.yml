trigger: none

variables:
  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/infra'
  terraformVersion: '1.15.9'

  # Web application होने पर true करें
  runDAST: 'false'
  dastTargetUrl: 'https://your-application-url.com'

jobs:

# ============================================================
# JOB 1: INIT, SECURITY SCANS AND TERRAFORM PLAN
# ============================================================
- job: TerraformPlan
  displayName: Security Scans and Terraform Plan

  pool:
    name: Akhilesh

  steps:

  - checkout: self
    clean: true
    fetchDepth: 0

  # ----------------------------------------------------------
  # Download Terraform directly from HashiCorp
  # TerraformInstaller task का उपयोग नहीं किया गया है
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: Download and Install Terraform
    inputs:
      targetType: inline
      script: |
        $terraformVersion = "$(terraformVersion)"
        $downloadUrl = "https://releases.hashicorp.com/terraform/$terraformVersion/terraform_${terraformVersion}_windows_amd64.zip"
        $zipFile = "$(Agent.TempDirectory)\terraform-$terraformVersion.zip"
        $installDirectory = "$(Agent.TempDirectory)\terraform-$terraformVersion"

        Write-Host "Downloading Terraform from:"
        Write-Host $downloadUrl

        if (Test-Path $zipFile) {
          Remove-Item -Path $zipFile -Force
        }

        if (Test-Path $installDirectory) {
          Remove-Item -Path $installDirectory -Recurse -Force
        }

        New-Item -Path $installDirectory -ItemType Directory -Force | Out-Null

        Invoke-WebRequest -Uri $downloadUrl -OutFile $zipFile

        if (-not (Test-Path $zipFile)) {
          Write-Error "Terraform ZIP download failed."
          exit 1
        }

        Expand-Archive -Path $zipFile -DestinationPath $installDirectory -Force

        $terraformExe = Join-Path $installDirectory "terraform.exe"

        if (-not (Test-Path $terraformExe)) {
          Write-Error "terraform.exe was not found after extraction."
          exit 1
        }

        Write-Host "##vso[task.prependpath]$installDirectory"

        Write-Host "Terraform installed successfully:"
        Write-Host $terraformExe

        & $terraformExe version

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform verification failed."
          exit 1
        }

  # ----------------------------------------------------------
  # Verify Terraform path
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: Verify Terraform PATH
    inputs:
      targetType: inline
      script: |
        $terraformCommand = Get-Command terraform -ErrorAction SilentlyContinue

        if (-not $terraformCommand) {
          Write-Error "Terraform is not available in PATH."
          exit 1
        }

        Write-Host "Terraform executable:"
        Write-Host $terraformCommand.Source

        terraform version

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform could not be started."
          exit 1
        }

  # ----------------------------------------------------------
  # Terraform Init
  # ----------------------------------------------------------
  - task: TerraformTask@5
    displayName: Terraform Init
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(terraformWorkingDirectory)'
      backendServiceArm: 'akhilesh25'
      backendAzureRmResourceGroupName: 'akhileshtestpip'
      backendAzureRmStorageAccountName: 'akhileshstoragepipi1'
      backendAzureRmContainerName: 'akhileshcanttest1'
      backendAzureRmKey: 'pipe.tfstate'

  # ----------------------------------------------------------
  # Terraform Format Check
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: Terraform Format Check
    inputs:
      targetType: inline
      workingDirectory: '$(terraformWorkingDirectory)'
      script: |
        terraform fmt -check -recursive

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform formatting check failed."
          Write-Host "Run locally: terraform fmt -recursive"
          exit 1
        }

  # ----------------------------------------------------------
  # Terraform Validate
  # ----------------------------------------------------------
  - task: TerraformTask@5
    displayName: Terraform Validate
    inputs:
      provider: 'azurerm'
      command: 'validate'
      workingDirectory: '$(terraformWorkingDirectory)'

  # ----------------------------------------------------------
  # Install security scanning tools
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: Install Security Scanning Tools
    inputs:
      targetType: inline
      script: |
        if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
          Write-Error "Chocolatey is not installed on the self-hosted agent."
          exit 1
        }

        if (-not (Get-Command tflint -ErrorAction SilentlyContinue)) {
          Write-Host "Installing TFLint..."
          choco install tflint -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            Write-Error "TFLint installation failed."
            exit 1
          }
        }
        else {
          Write-Host "TFLint is already installed."
        }

        if (-not (Get-Command tfsec -ErrorAction SilentlyContinue)) {
          Write-Host "Installing tfsec..."
          choco install tfsec -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            Write-Error "tfsec installation failed."
            exit 1
          }
        }
        else {
          Write-Host "tfsec is already installed."
        }

        if (-not (Get-Command gitleaks -ErrorAction SilentlyContinue)) {
          Write-Host "Installing Gitleaks..."
          choco install gitleaks -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Gitleaks installation failed."
            exit 1
          }
        }
        else {
          Write-Host "Gitleaks is already installed."
        }

        if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
          Write-Error "Python is not installed on the self-hosted agent."
          exit 1
        }

        Write-Host "Installing Checkov..."
        python -m pip install --upgrade pip
        python -m pip install --upgrade checkov

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Checkov installation failed."
          exit 1
        }

  # ----------------------------------------------------------
  # TFLint scan
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: TFLint Code Quality Scan
    inputs:
      targetType: inline
      workingDirectory: '$(terraformWorkingDirectory)'
      script: |
        tflint --init

        if ($LASTEXITCODE -ne 0) {
          Write-Error "TFLint initialization failed."
          exit 1
        }

        tflint --recursive

        if ($LASTEXITCODE -ne 0) {
          Write-Error "TFLint detected Terraform code issues."
          exit 1
        }

  # ----------------------------------------------------------
  # tfsec security scan
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: tfsec Infrastructure Security Scan
    inputs:
      targetType: inline
      workingDirectory: '$(terraformWorkingDirectory)'
      script: |
        tfsec . --format default --minimum-severity HIGH

        if ($LASTEXITCODE -ne 0) {
          Write-Error "tfsec detected HIGH or CRITICAL security issues."
          exit 1
        }

  # ----------------------------------------------------------
  # Checkov security and compliance scan
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: Checkov Security and Compliance Scan
    inputs:
      targetType: inline
      workingDirectory: '$(terraformWorkingDirectory)'
      script: |
        checkov --directory . --framework terraform --compact --quiet --soft-fail-on MEDIUM

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Checkov detected blocking security issues."
          exit 1
        }

  # ----------------------------------------------------------
  # Gitleaks secrets scan
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: Gitleaks Secret Scan
    inputs:
      targetType: inline
      workingDirectory: '$(System.DefaultWorkingDirectory)'
      script: |
        gitleaks detect --source "$(System.DefaultWorkingDirectory)" --no-banner --redact --verbose

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Gitleaks detected credentials or secrets."
          exit 1
        }

  # ----------------------------------------------------------
  # Terraform Plan
  # ----------------------------------------------------------
  - task: TerraformTask@5
    displayName: Terraform Plan
    inputs:
      provider: 'azurerm'
      command: 'plan'
      workingDirectory: '$(terraformWorkingDirectory)'
      environmentServiceNameAzureRM: 'akhilesh25'
      commandOptions: '-out=tfplan'

  # ----------------------------------------------------------
  # Publish Terraform Plan
  # ----------------------------------------------------------
  - task: PublishPipelineArtifact@1
    displayName: Publish Terraform Plan
    inputs:
      targetPath: '$(terraformWorkingDirectory)/tfplan'
      artifact: 'terraform-plan'
      publishLocation: 'pipeline'


# ============================================================
# JOB 2: MANUAL APPROVAL
# ============================================================
- job: ManualApproval
  displayName: Manual Approval
  dependsOn: TerraformPlan
  condition: succeeded()

  pool: server
  timeoutInMinutes: 1440

  steps:

  - task: ManualValidation@1
    displayName: Approve Terraform Deployment
    timeoutInMinutes: 1440
    inputs:
      notifyUsers: ''
      instructions: |
        Terraform Init, Validate and security scans completed successfully.

        Please review:
        1. Terraform Plan
        2. TFLint results
        3. tfsec results
        4. Checkov results
        5. Gitleaks results

        Click Resume to run Terraform Apply.
      onTimeout: 'reject'


# ============================================================
# JOB 3: TERRAFORM APPLY
# ============================================================
- job: TerraformApply
  displayName: Terraform Apply
  dependsOn: ManualApproval
  condition: succeeded()

  pool:
    name: Akhilesh

  steps:

  - checkout: self
    clean: true

  # ----------------------------------------------------------
  # Fresh Terraform installation for Apply job
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: Download and Install Terraform
    inputs:
      targetType: inline
      script: |
        $terraformVersion = "$(terraformVersion)"
        $downloadUrl = "https://releases.hashicorp.com/terraform/$terraformVersion/terraform_${terraformVersion}_windows_amd64.zip"
        $zipFile = "$(Agent.TempDirectory)\terraform-$terraformVersion.zip"
        $installDirectory = "$(Agent.TempDirectory)\terraform-$terraformVersion"

        if (Test-Path $zipFile) {
          Remove-Item -Path $zipFile -Force
        }

        if (Test-Path $installDirectory) {
          Remove-Item -Path $installDirectory -Recurse -Force
        }

        New-Item -Path $installDirectory -ItemType Directory -Force | Out-Null

        Invoke-WebRequest -Uri $downloadUrl -OutFile $zipFile

        if (-not (Test-Path $zipFile)) {
          Write-Error "Terraform ZIP download failed."
          exit 1
        }

        Expand-Archive -Path $zipFile -DestinationPath $installDirectory -Force

        $terraformExe = Join-Path $installDirectory "terraform.exe"

        if (-not (Test-Path $terraformExe)) {
          Write-Error "terraform.exe was not found after extraction."
          exit 1
        }

        Write-Host "##vso[task.prependpath]$installDirectory"

        Write-Host "Terraform installed successfully:"
        Write-Host $terraformExe

        & $terraformExe version

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform verification failed."
          exit 1
        }

  # ----------------------------------------------------------
  # Terraform Re-Init
  # ----------------------------------------------------------
  - task: TerraformTask@5
    displayName: Terraform Re-Init
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(terraformWorkingDirectory)'
      backendServiceArm: 'akhilesh25'
      backendAzureRmResourceGroupName: 'akhileshtestpip'
      backendAzureRmStorageAccountName: 'akhileshstoragepipi1'
      backendAzureRmContainerName: 'akhileshcanttest1'
      backendAzureRmKey: 'pipe.tfstate'

  # ----------------------------------------------------------
  # Download exact approved plan
  # ----------------------------------------------------------
  - task: DownloadPipelineArtifact@2
    displayName: Download Approved Terraform Plan
    inputs:
      artifact: 'terraform-plan'
      path: '$(terraformWorkingDirectory)'

  # ----------------------------------------------------------
  # Apply exact approved plan
  # ----------------------------------------------------------
  - task: TerraformTask@5
    displayName: Terraform Apply
    inputs:
      provider: 'azurerm'
      command: 'apply'
      workingDirectory: '$(terraformWorkingDirectory)'
      environmentServiceNameAzureRM: 'akhilesh25'
      commandOptions: '-auto-approve tfplan'


# ============================================================
# JOB 4: OPTIONAL DAST SCAN
# ============================================================
- job: DASTScan
  displayName: OWASP ZAP DAST Scan
  dependsOn: TerraformApply

  condition: |
    and(
      succeeded(),
      eq(variables['runDAST'], 'true')
    )

  pool:
    name: Akhilesh

  steps:

  - task: PowerShell@2
    displayName: Validate DAST Configuration
    inputs:
      targetType: inline
      script: |
        $targetUrl = "$(dastTargetUrl)"

        if ([string]::IsNullOrWhiteSpace($targetUrl)) {
          Write-Error "DAST target URL is empty."
          exit 1
        }

        if ($targetUrl -eq "https://your-application-url.com") {
          Write-Error "Replace dastTargetUrl with the actual application URL."
          exit 1
        }

        docker version

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Docker is not installed or Docker Engine is not running."
          exit 1
        }

  - task: PowerShell@2
    displayName: Prepare DAST Report Directory
    inputs:
      targetType: inline
      script: |
        $reportDirectory = "$(System.DefaultWorkingDirectory)\zap-results"

        if (Test-Path $reportDirectory) {
          Remove-Item -Path $reportDirectory -Recurse -Force
        }

        New-Item -Path $reportDirectory -ItemType Directory -Force | Out-Null

  - task: PowerShell@2
    displayName: OWASP ZAP Baseline Scan
    inputs:
      targetType: inline
      script: |
        docker pull zaproxy/zap-stable

        if ($LASTEXITCODE -ne 0) {
          Write-Error "OWASP ZAP Docker image download failed."
          exit 1
        }

        docker run --rm -v "$(System.DefaultWorkingDirectory)\zap-results:/zap/wrk/:rw" zaproxy/zap-stable zap-baseline.py -t "$(dastTargetUrl)" -r zap-report.html -I

        if ($LASTEXITCODE -ne 0) {
          Write-Error "OWASP ZAP security scan failed."
          exit 1
        }

  - task: PublishPipelineArtifact@1
    displayName: Publish OWASP ZAP Report
    condition: always()
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/zap-results'
      artifact: 'owasp-zap-report'
      publishLocation: 'pipeline'